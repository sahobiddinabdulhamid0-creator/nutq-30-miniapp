<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Nutq 30</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="/css/app.css?v=2.2.0">
</head>
<body>
  <div id="appShell" class="app-shell">
    <header id="appHeader" class="app-header">
      <button class="brand" type="button" onclick="App.navigate('home')" aria-label="Bosh sahifa">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span>
          <strong>Nutq 30</strong>
          <small>audio nutq chellenji</small>
        </span>
      </button>
      <button id="profileButton" class="avatar-button" type="button" onclick="App.navigate('profile')" aria-label="Profil va sozlamalar">
        <span id="avatarInitial">N</span>
      </button>
    </header>

    <main id="mainViewport" class="main-viewport" aria-live="polite">
      <div class="initial-loader">
        <span class="spinner"></span>
        <p>Nutq 30 tayyorlanmoqda…</p>
      </div>
    </main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Asosiy navigatsiya">
      <button type="button" data-route="home" onclick="App.navigate('home')"><span aria-hidden="true">⌂</span><small>Bugun</small></button>
      <button type="button" data-route="map" onclick="App.navigate('map')"><span aria-hidden="true">▦</span><small>30 kun</small></button>
      <button type="button" data-route="library" onclick="App.navigate('library')"><span aria-hidden="true">☰</span><small>Bilimlar</small></button>
      <button type="button" data-route="progress" onclick="App.navigate('progress')"><span aria-hidden="true">↗</span><small>Natija</small></button>
    </nav>
  </div>

  <div id="loadingOverlay" class="overlay hidden" role="status" aria-live="assertive">
    <div class="overlay-card">
      <span class="spinner"></span>
      <strong id="loadingTitle">Tayyorlanmoqda…</strong>
      <p id="loadingText">Iltimos, oynani yopmang.</p>
    </div>
  </div>

  <div id="dialogOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <div class="dialog-card">
      <h2 id="dialogTitle">Tasdiqlang</h2>
      <p id="dialogText"></p>
      <div class="button-row">
        <button class="button secondary" type="button" onclick="App.closeDialog()">Bekor qilish</button>
        <button id="dialogConfirm" class="button danger" type="button">Tasdiqlash</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"><span id="toastText"></span></div>

  <script src="/js/telegram.js?v=2.2.0" defer></script>
  <script src="/js/api.js?v=2.2.0" defer></script>
  <script src="/js/storage.js?v=2.2.0" defer></script>
  <script src="/js/liveTranscriber.js?v=2.2.0" defer></script>
  <script src="/js/audioRecorder.js?v=2.2.0" defer></script>
  <script src="/js/screens.js?v=2.2.0" defer></script>
  <script src="/js/app.js?v=2.2.0" defer></script>
</body>
</html>
